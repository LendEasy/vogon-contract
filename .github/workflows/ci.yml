name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, types and tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # a turn service runs on whatever Python the application has, and
        # this package is the only thing it installs from us
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        # the package ships py.typed and claims Typing :: Typed
        run: mypy src
      - name: Tests
        run: python -m pytest tests -q

  dist:
    name: distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check the metadata PyPI will read
        run: twine check dist/*
      - name: The wheel installs and imports on its own
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd / && "$RUNNER_TEMP/wheel/bin/python" -c "
          import vogon_contract, vogon_contract.codec
          from vogon_contract import StartCallRequest, RecordTransferRequest
          print(vogon_contract.__file__, len(vogon_contract.__all__), 'names')"
      - name: The wheel ships py.typed
        run: unzip -l dist/*.whl | grep 'vogon_contract/py.typed'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  gateway:
    # The contract exists for the gateway to speak it: a change here that
    # breaks the gateway fails before it merges. The gateway's own CI covers
    # the other direction (the gateway against the contract's main).
    name: the gateway against this contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: contract
      - uses: actions/checkout@v4
        with:
          repository: LendEasy/vogon
          path: vogon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native libraries for the echo canceller
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git g++ swig libspeex-dev libspeexdsp-dev
      - name: Install the gateway with this checkout of the contract
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          pip install ./contract
          pip install -e "./vogon[front,dev]"
          vogon/deploy/build_speexdsp.sh python
      - name: The gateway's suite
        working-directory: vogon
        run: python -m pytest tests -q
